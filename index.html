<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untuk Kamu 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background-color:#ffeaf1;background-image:linear-gradient(90deg,rgba(255,150,185,.22) 50%,transparent 50%),linear-gradient(rgba(255,150,185,.22) 50%,transparent 50%);background-size:44px 44px;font-family:'Cormorant Garamond',Georgia,serif;color:#6b2a45;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
h1{font-family:'Caveat',cursive;font-size:2.4rem;color:#d4577f;font-weight:600}
.sub{font-style:italic;opacity:.75;margin-bottom:8px}
#bow{width:min(300px,72vw);cursor:pointer;filter:drop-shadow(0 10px 18px rgba(212,87,127,.45));animation:bob 3s ease-in-out infinite;touch-action:manipulation}
#bow.tap{animation:wig .6s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes wig{0%{transform:scale(1)}30%{transform:scale(1.2) rotate(6deg)}60%{transform:scale(.92) rotate(-5deg)}100%{transform:scale(1)}}
#hint{margin-top:14px;font-style:italic;font-size:1.2rem;color:#c2487a;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
#cnt{margin-top:6px;font-size:1rem;opacity:.7}
.h{position:fixed;pointer-events:none;z-index:2;user-select:none}
.amb{animation:up linear forwards}
@keyframes up{from{transform:translateY(0);opacity:.8}to{transform:translateY(-110vh);opacity:0}}
.bst{animation:bst 1.3s ease-out forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
#ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(150,40,90,.3);backdrop-filter:blur(3px)}
#ov.on{display:flex}
.card{max-width:min(460px,100%);max-height:88vh;overflow:auto;background:#fffaf8;border-radius:18px;padding:30px 24px 22px;text-align:center;box-shadow:0 20px 60px rgba(160,40,90,.35);border:3px solid #ffc2d6;position:relative;animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
.card::before{content:"🎀";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:2rem}
.card::after{content:"";position:absolute;inset:6px;border:1.5px dashed #ffb3cb;border-radius:13px;pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.85) rotate(-3deg)}to{opacity:1;transform:none}}
.card p{font-family:'Caveat',cursive;font-size:1.5rem;line-height:1.38;color:#6b2a45}
.card .ph{background:#fff;padding:8px 8px 10px;margin:0 auto 16px;width:min(230px,70%);box-shadow:0 6px 16px rgba(160,40,90,.25);transform:rotate(-2.5deg)}
.card .ph img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.close{margin-top:14px;font-size:.9rem;opacity:.5;font-style:italic}
#fin{position:fixed;inset:0;z-index:6;display:none;overflow:auto;background-color:#ffeaf1;background-image:linear-gradient(90deg,rgba(255,150,185,.22) 50%,transparent 50%),linear-gradient(rgba(255,150,185,.22) 50%,transparent 50%);background-size:44px 44px;padding:34px 16px 60px;text-align:center}
#fin.on{display:block;animation:pop .8s ease}
#fin h2{font-family:'Caveat',cursive;font-size:2.4rem;color:#d4577f}
.strips{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.strip{background:#fff;padding:12px 12px 8px;width:158px;box-shadow:0 12px 28px rgba(160,40,90,.3);transform:rotate(var(--r))}
.strip img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;margin-bottom:8px;cursor:pointer;background:#fde}
.strip small{display:block;font-family:'Caveat',cursive;font-size:1.05rem;color:#c2487a;padding:2px 0 4px}
.end{font-family:'Caveat',cursive;font-size:1.9rem;line-height:1.45;max-width:520px;margin:10px auto 0;color:#6b2a45}
button{margin-top:26px;background:#d4577f;color:#fff;border:0;padding:11px 28px;border-radius:30px;font-family:inherit;font-size:1.15rem;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(60,10,35,.9);z-index:9;display:none;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:92vh;border-radius:6px}
</style>
</head>

const $=id=>document.getElementById(id);
let step=0,locked=false;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ambient hearts */
const EM=['🩷','💗','🎀','🤍','💕'];
setInterval(()=>{const e=document.createElement('div');e.className='h amb';e.textContent=EM[Math.random()*EM.length|0];
 e.style.left=Math.random()*100+'vw';e.style.bottom='-30px';e.style.fontSize=(14+Math.random()*16)+'px';e.style.animationDuration=(9+Math.random()*7)+'s';
 document.body.appendChild(e);setTimeout(()=>e.remove(),17000)},900);
function burst(){const r=$('bow').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<26;i++){const e=document.createElement('div');e.className='h bst';e.textContent=EM[Math.random()*EM.length|0];
  const a=Math.random()*6.28,d=90+Math.random()*190;
  e.style.left=cx+'px';e.style.top=cy+'px';e.style.fontSize=(16+Math.random()*18)+'px';
  e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',(Math.sin(a)*d-40)+'px');e.style.setProperty('--rt',(Math.random()*120-60)+'deg');
  document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}

function counter(){$('cnt').textContent=step+' / '+STEPS.length+' pita terbuka'}
$('bow').addEventListener('pointerdown',()=>{
  if(locked)return;locked=true;
  $('bow').classList.remove('tap');void $('bow').offsetWidth;$('bow').classList.add('tap');burst();
  setTimeout(()=>{
    if(step<STEPS.length){
      const s=STEPS[step];step++;counter();
      let h='';
      if(s.img!=null)h+=`<div class="ph"><img src="data:image/jpeg;base64,${IMGS[s.img]}" alt=""></div>`;
      h+='<p>'+esc(s.text)+'</p><div class="close">ketuk untuk menutup</div>';
      $('card').innerHTML=h;$('ov').classList.add('on');
    }else finale();
  },750);
});
$('ov').onclick=()=>{$('ov').classList.remove('on');locked=false;
  if(step>=STEPS.length)$('hint').textContent='sentuh sekali lagi 🎀'};

/* finale: photobooth strips */
function strip(ids,r){const d=document.createElement('div');d.className='strip';d.style.setProperty('--r',r);
 d.innerHTML=ids.map(i=>`<img src="data:image/jpeg;base64,${IMGS[i]}" alt="" data-i="${i}">`).join('')+`<small>🎀 ${DATE}</small>`;
 d.querySelectorAll('img').forEach(im=>im.onclick=()=>{$('lbi').src=im.src;$('lb').classList.add('on')});return d}
$('strips').appendChild(strip([0,1,2],'-4deg'));$('strips').appendChild(strip([3,4,0],'3deg'));
$('lb').onclick=()=>$('lb').classList.remove('on');
function finale(){$('endmsg').textContent=CLOSING;$('fin').classList.add('on');}
$('again').onclick=()=>{$('fin').classList.remove('on');step=0;counter();locked=false;$('hint').textContent='sentuh pitanya 🎀'};
counter();
</script>
</body>
